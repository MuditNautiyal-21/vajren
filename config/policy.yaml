# The rules that decide what VAJREN may do on its own.
# Loaded by core/policy.py. Changes here are a HUMAN-ONLY edit — the agent must
# never be given a tool that writes this file.

# --------------------------------------------------------------------------
# TIER 1 — runs freely, no confirmation
# Reversible, read-only, or produces something you review before it matters.
# --------------------------------------------------------------------------
auto:
  - read_file
  - list_directory
  - search_files
  - web_search
  - fetch_page
  - read_email
  - label_email
  - draft_email          # drafting is safe; sending is not
  - read_calendar
  - find_free_slots
  - summarize
  - remember_fact
  - recall
  - forget_fact           # supersedes, never deletes
  - detect_hardware          # read-only probes: nvidia-smi, rocminfo, vulkaninfo, WMI
  - benchmark_model          # llama-bench sweep; compute only, no persistent change
  - select_backend           # writes VAJREN's own config, nothing system-wide
  - browser_read             # the page's text. Untrusted, quarantined.
  - browser_find             # numbered clickable things. Untrusted.
  - browser_back
  - app_find                 # numbered controls of a native window. Untrusted.
  - open_application
  - focus_window         # raises a window that is ALREADY open. Changes nothing
                         # on disk, cannot destroy anything, and asking
                         # permission to un-hide a window Mudit just asked for
                         # is the kind of friction that makes a gate ignored.
  - screenshot
  - look_at_screen          # a screenshot, described by the local vision model. Never leaves the box.
  - git_status
  - git_diff
  - run_tests

# --------------------------------------------------------------------------
# TIER 2 — speaks its plan, waits for the confirmation phrase
# --------------------------------------------------------------------------
confirm:
  - send_email
  - reply_email
  - create_calendar_event
  - update_calendar_event
  - write_file
  - move_file
  - trash_file
  - undo_file            # restores bytes, so it writes bytes; confirm like any write
  - run_shell            # the gate speaks the LITERAL command, not the model's summary
  - open_app             # launches a program; detached, so it outlives Vajren
  - open_path            # opens a file/folder with its default program
  - open_url             # opens a web page, optionally in a named browser profile
  - close_window         # WM_CLOSE first; force only when asked. Can lose unsaved work.
  - browser_open         # Vajren's OWN Chrome profile, never Mudit's. See core/browser.py.
  - browser_click        # ...once per request, EXCEPT labels in always_confirm_labels
  - browser_type         # ...once per request; password fields are refused in code
  - app_click            # native apps via UI Automation; same rules as browser_click
  - app_type             # same rules as browser_type
  - run_python
  - browser_submit
  - browser_login
  - git_commit
  - git_push
  - install_package
  - install_mcp_server
  - save_new_skill
  - post_message
  - download_model           # large, but reversible and confined to models/
  - install_runtime          # llama.cpp binaries into VAJREN's own tree

# --------------------------------------------------------------------------
# TIER 2b — confirm ONCE PER REQUEST, not once per step
#
# ⚠ Mudit: "if I say open google chrome and go to linkedin and search for so
#   and so, it should not ask me for permission for every step."
#   He is right, and the reason he is right is that a gate asked too often
#   stops being read. Three approvals for one search is three reflex yeses,
#   and a reflex yes protects nobody — it is strictly worse than one approval
#   he actually listens to.
#
# What makes these safe to grant for a whole request, and the test any new
# entry must pass: they OPEN things. Nothing here writes, deletes, sends,
# spends, or changes a file. The worst outcome of a wrong one is a window on
# screen that Mudit closes. The first approval still says what is about to
# happen, and any tool NOT on this list still asks every single time —
# write_file, trash_file, run_shell, send_email, git_push and the rest are
# unchanged.
confirm_once_per_task:
  - open_app
  - open_url
  - open_path
  - focus_window
  - browser_open
  - browser_click
  - browser_type
  - app_click
  - app_type

# --------------------------------------------------------------------------
# TIER 2c — THE REQUEST IS THE YES  (J-055, 2026-09-06)
#
# ⚠ Mudit: "I am so tired with saying just yes no! We should be careful, that
#   is understandable, but why regress? Make it a real autonomous assistant."
#
# The line that makes autonomy safe is not "ask about everything" - it is
# "ask about what cannot be taken back". When he has asked for something,
# every step that (a) only opens or points at things, or (b) can be UNDONE
# by Vajren itself, runs without a question. It is narrated on screen as it
# goes, logged, verified, and reversible with /undo. What still asks, every
# time: anything that leaves the machine or cannot be undone - sending a
# message, a shell command, a permanent delete, a payment, a push.
#
# request_is_the_yes: true  -> confirm_once_per_task tools need no first ask
#                              at all, and the tools below join them because
#                              each returns an undo_ref (a snapshot) or
#                              closes gracefully (WM_CLOSE lets the app save).
# Set false to get the old one-ask-per-request behaviour back.
autonomy:
  request_is_the_yes: true
  undoable_tools:
    - write_file            # snapshotted before every write; undo_file restores
    - trash_file            # moved to Vajren's trash, never deleted; undo_file restores
    - close_window          # WM_CLOSE: the app gets to ask "save changes?". force=true still asks

# ⚠ A click is a click until it is a purchase. These words, in the label of the
#   thing about to be pressed, take the action OUT of the once-per-request
#   grant and back to asking every time — decided in code (core/policy.py),
#   against the label the tool verifies is really on the element. The planner
#   cannot rename a Buy button to get it through; browser_click refuses if the
#   label it was given is not the label on the page.
always_confirm_labels:
  - buy
  - pay
  - purchase
  - checkout
  - place order
  - order
  - subscribe
  - send
  - post
  - publish
  - tweet
  - reply
  - comment
  - delete
  - remove
  - unsubscribe
  - confirm
  - submit
  - apply
  - sign out
  - log out
  - logout
  - transfer
  - call
  - video call
  - voice call
  - accept
  - agree
  - install
  - download

# --------------------------------------------------------------------------
# LEARNED TRUST — what may stop asking after Mudit has said yes enough
#
# core/memory.py counts approvals per SHAPE (tool + folder / host / app /
# label). Three in a row with no cancel and the shape stops asking; it is
# announced out loud at that moment, listed by scripts/29-memory-report.py,
# reset by a single cancel, and revoked by "ask me about that again".
#
# ⚠ These can NEVER earn it, however many times he says yes. The test: could
#   one wrong run of this lose something that undo cannot bring back, or reach
#   somebody other than Mudit? If yes, it asks every time, forever.
never_trusted:
  - run_shell
  - trash_file
  - undo_file
  - send_email
  - reply_email
  - git_push
  - git_commit
  - install_package
  - install_mcp_server
  - post_message
  - browser_login
  - browser_submit
  - close_window          # can discard unsaved work
  - save_new_skill
  - download_model
  - install_runtime

# --------------------------------------------------------------------------
# TIER 3 — never, under any circumstances, without a human at the keyboard.
# Not "confirm twice". Not available as a tool at all.
# --------------------------------------------------------------------------
forbidden:
  - permanent_delete            # everything goes to the Recycle Bin instead
  - empty_recycle_bin
  - purchase
  - payment
  - modify_own_permissions
  - modify_policy_file
  - modify_oauth_scopes
  - disable_audit_log
  - disable_kill_switch
  - add_remote_device
  - format_disk
  - registry_write
  # --- self-configuration has a hard ceiling -------------------------------
  # Detecting hardware and choosing a backend is safe and runs unattended.
  # Changing the machine is not, and never becomes safe by being useful.
  # An agent that can install a driver or elevate itself is also an agent that
  # can be talked into doing so by a hostile email. This is the exact pattern
  # 2026 CISA/NIST agentic-AI guidance flags as highest-risk, and the same line
  # Ansible, winget, Chocolatey and Homebrew all draw at "become: true".
  - install_driver              # GPU drivers, CUDA/ROCm toolkits
  - modify_system_path          # system-wide PATH or environment variables
  - create_system_service       # a boot-start service is a one-time human act
  - modify_system_service
  - self_elevate                # never requests admin on its own behalf
  - disable_defender

# --------------------------------------------------------------------------
# Data routing. Enforced in code. A prompt cannot be talked out of an if-statement.
# --------------------------------------------------------------------------
private_lane_triggers:
  # if a task touches any of these, it may only use vajren-private (local)
  sources: [email, calendar, drive, local_files, contacts, credentials, memory]
  patterns:
    - "(?i)\\bpassword\\b"
    - "(?i)\\bapi[_ -]?key\\b"
    - "(?i)\\bssn\\b"
    - "(?i)\\bpassport\\b"
    - "(?i)\\baccount number\\b"
    - "\\b\\d{3}-\\d{2}-\\d{4}\\b"

# --------------------------------------------------------------------------
# Places the agent may never read or write, checked in code before any tool runs.
# Add to this list freely; it is a denylist, not a hint.
# --------------------------------------------------------------------------
denylist_paths:
  - "C:\\Windows"
  - "C:\\Program Files"
  - "C:\\Program Files (x86)"
  - "C:\\vajren\\config\\policy.yaml"
  - "C:\\vajren\\.env"
  - "C:\\vajren\\CLAUDE.md"
  - "**/.ssh/**"
  - "**/.gitconfig"
  - "**/AppData/Roaming/Microsoft/Crypto/**"
  - "**/AppData/Local/Microsoft/Credentials/**"

writable_roots:
  - "C:\\vajren\\workspace"
  - "C:\\vajren\\sandbox"
  - "C:\\vajren\\memory"
  - "C:\\vajren\\logs"
  # add your real working folders here, deliberately, one at a time

# --------------------------------------------------------------------------
# Voice confirmation dialogue
# --------------------------------------------------------------------------
confirmation:
  # People do not speak in magic phrases. The first version accepted exactly
  # three, and anything else — "yeah do it", "sure", "nope" — fell through to
  # "Sorry, say yes go ahead or cancel", which is infuriating and made the
  # assistant feel deaf. These lists are the FAST path; anything they miss goes
  # to core/confirm.py, which asks the small model and still refuses to approve
  # on anything it is not sure about.
  #
  # ⚠ Order of defence: only the FIRST few words are read as the answer
  #   (core.policy.LEAD_WORDS). Within that window: negation → cancel list →
  #   affirm list. Cancel always wins, so "no, go ahead" is a cancel. A cancel
  #   word later in the sentence still cancels; a NEGATION later does not,
  #   because it is almost always elaboration on an answer already given:
  #   "yes, go ahead, and make sure it does not stay hidden" is an approval.
  #   Anything the window cannot decide goes to the model in core/confirm.py.
  affirm_phrases:
    - "yes go ahead"
    - "go ahead vajren"
    - "confirmed go ahead"
    - "yes"
    - "yeah"
    - "yep"
    - "yup"
    - "sure"
    - "okay"
    - "ok"
    - "do it"
    - "go for it"
    - "go ahead"          # safe here ONLY because negation is checked first
    - "please do"
    - "affirmative"
    - "confirmed"
    - "approved"
    - "sounds good"
    - "that's fine"
    - "carry on"
    - "proceed"
  cancel_phrases:
    - "cancel"
    - "stop"
    - "no cancel that"
    - "no"
    - "nope"
    - "nah"
    - "don't"
    - "do not"
    - "never mind"
    - "nevermind"
    - "forget it"
    - "hold on"
    - "wait"
    - "not now"
    - "leave it"
    - "abort"
    - "negative"
  # Words that flip an otherwise affirmative sentence. "don't go ahead",
  # "no, do it later", "stop, that's wrong" — all cancels regardless of what
  # else the sentence contains.
  negations: ["not", "don't", "dont", "do not", "never", "no", "nope", "nah"]
  # ⚠ A RETRACTION is a word whose only job is to take something back, so it
  #   is honoured anywhere in the sentence — including after an approval:
  #   "sure, go ahead — actually, cancel that." Short negatives like "no" and
  #   "not" are deliberately NOT here: they turn up constantly inside ordinary
  #   elaboration ("and no rush", "make sure it does not stay hidden") and
  #   treating them as retractions cancelled a clear spoken approval. See J-040.
  retractions:
    - "cancel"
    - "abort"
    - "stop"
    - "never mind"
    - "nevermind"
    - "forget it"
    - "hold on"
    - "not now"
    - "leave it"
    - "scratch that"
    - "belay that"
  timeout_seconds: 10
  on_timeout: cancel            # NEVER "proceed"
  # ⚠ 0.35, MEASURED — not the 0.75 it was before any confidence existed.
  #   scripts/17b-calibrate-confidence.py: Whisper's per-token confidence does
  #   NOT separate right from wrong. Clean "cancel" scores 0.44; a WRONG
  #   "Let's go ahead" (from "yes go ahead" under noise) scores 0.58. No
  #   threshold on that score works, and 0.75 rejected every clean approval.
  #   What actually protects the gate is the exact-phrase match above — noise
  #   turns words into DIFFERENT words ("Confirms go ahead", "cancer"), which
  #   then fail to match. This floor only catches near-silence garbage, which
  #   scored 0.19–0.32. Do not "tighten" it; tighten the phrases instead.
  min_stt_confidence: 0.35
  reask_once_on_low_confidence: true

# --------------------------------------------------------------------------
# Loop safety
# --------------------------------------------------------------------------
limits:
  max_steps_per_task: 25
  max_consecutive_tool_failures: 3
  circuit_breaker_cooldown_s: 120
  max_ram_gb_llm: 24            # watchdog kills and restarts above this
