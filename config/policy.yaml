# The rules that decide what VAJREN may do on its own.
# Loaded by core/policy.py. Changes here are a HUMAN-ONLY edit — the agent must
# never be given a tool that writes this file.

# --------------------------------------------------------------------------
# TIER 1 — runs freely, no confirmation
# Reversible, read-only, or produces something you review before it matters.
# --------------------------------------------------------------------------
auto:
  - read_file
  - list_directory
  - search_files
  - web_search
  - fetch_page
  - read_email
  - label_email
  - draft_email          # drafting is safe; sending is not
  - read_calendar
  - find_free_slots
  - summarize
  - remember_fact
  - recall
  - detect_hardware          # read-only probes: nvidia-smi, rocminfo, vulkaninfo, WMI
  - benchmark_model          # llama-bench sweep; compute only, no persistent change
  - select_backend           # writes VAJREN's own config, nothing system-wide
  - open_application
  - screenshot
  - git_status
  - git_diff
  - run_tests

# --------------------------------------------------------------------------
# TIER 2 — speaks its plan, waits for the confirmation phrase
# --------------------------------------------------------------------------
confirm:
  - send_email
  - reply_email
  - create_calendar_event
  - update_calendar_event
  - write_file
  - move_file
  - trash_file
  - undo_file            # restores bytes, so it writes bytes; confirm like any write
  - run_shell            # the gate speaks the LITERAL command, not the model's summary
  - run_python
  - browser_submit
  - browser_login
  - git_commit
  - git_push
  - install_package
  - install_mcp_server
  - save_new_skill
  - post_message
  - download_model           # large, but reversible and confined to models/
  - install_runtime          # llama.cpp binaries into VAJREN's own tree

# --------------------------------------------------------------------------
# TIER 3 — never, under any circumstances, without a human at the keyboard.
# Not "confirm twice". Not available as a tool at all.
# --------------------------------------------------------------------------
forbidden:
  - permanent_delete            # everything goes to the Recycle Bin instead
  - empty_recycle_bin
  - purchase
  - payment
  - modify_own_permissions
  - modify_policy_file
  - modify_oauth_scopes
  - disable_audit_log
  - disable_kill_switch
  - add_remote_device
  - format_disk
  - registry_write
  # --- self-configuration has a hard ceiling -------------------------------
  # Detecting hardware and choosing a backend is safe and runs unattended.
  # Changing the machine is not, and never becomes safe by being useful.
  # An agent that can install a driver or elevate itself is also an agent that
  # can be talked into doing so by a hostile email. This is the exact pattern
  # 2026 CISA/NIST agentic-AI guidance flags as highest-risk, and the same line
  # Ansible, winget, Chocolatey and Homebrew all draw at "become: true".
  - install_driver              # GPU drivers, CUDA/ROCm toolkits
  - modify_system_path          # system-wide PATH or environment variables
  - create_system_service       # a boot-start service is a one-time human act
  - modify_system_service
  - self_elevate                # never requests admin on its own behalf
  - disable_defender

# --------------------------------------------------------------------------
# Data routing. Enforced in code. A prompt cannot be talked out of an if-statement.
# --------------------------------------------------------------------------
private_lane_triggers:
  # if a task touches any of these, it may only use vajren-private (local)
  sources: [email, calendar, drive, local_files, contacts, credentials, memory]
  patterns:
    - "(?i)\\bpassword\\b"
    - "(?i)\\bapi[_ -]?key\\b"
    - "(?i)\\bssn\\b"
    - "(?i)\\bpassport\\b"
    - "(?i)\\baccount number\\b"
    - "\\b\\d{3}-\\d{2}-\\d{4}\\b"

# --------------------------------------------------------------------------
# Places the agent may never read or write, checked in code before any tool runs.
# Add to this list freely; it is a denylist, not a hint.
# --------------------------------------------------------------------------
denylist_paths:
  - "C:\\Windows"
  - "C:\\Program Files"
  - "C:\\Program Files (x86)"
  - "C:\\vajren\\config\\policy.yaml"
  - "C:\\vajren\\.env"
  - "C:\\vajren\\CLAUDE.md"
  - "**/.ssh/**"
  - "**/.gitconfig"
  - "**/AppData/Roaming/Microsoft/Crypto/**"
  - "**/AppData/Local/Microsoft/Credentials/**"

writable_roots:
  - "C:\\vajren\\workspace"
  - "C:\\vajren\\sandbox"
  - "C:\\vajren\\memory"
  - "C:\\vajren\\logs"
  # add your real working folders here, deliberately, one at a time

# --------------------------------------------------------------------------
# Voice confirmation dialogue
# --------------------------------------------------------------------------
confirmation:
  affirm_phrases: ["yes go ahead", "go ahead vajren", "confirmed go ahead"]
  cancel_phrases: ["cancel", "stop", "no cancel that"]
  timeout_seconds: 10
  on_timeout: cancel            # NEVER "proceed"
  # ⚠ 0.35, MEASURED — not the 0.75 it was before any confidence existed.
  #   scripts/17b-calibrate-confidence.py: Whisper's per-token confidence does
  #   NOT separate right from wrong. Clean "cancel" scores 0.44; a WRONG
  #   "Let's go ahead" (from "yes go ahead" under noise) scores 0.58. No
  #   threshold on that score works, and 0.75 rejected every clean approval.
  #   What actually protects the gate is the exact-phrase match above — noise
  #   turns words into DIFFERENT words ("Confirms go ahead", "cancer"), which
  #   then fail to match. This floor only catches near-silence garbage, which
  #   scored 0.19–0.32. Do not "tighten" it; tighten the phrases instead.
  min_stt_confidence: 0.35
  reask_once_on_low_confidence: true

# --------------------------------------------------------------------------
# Loop safety
# --------------------------------------------------------------------------
limits:
  max_steps_per_task: 25
  max_consecutive_tool_failures: 3
  circuit_breaker_cooldown_s: 120
  max_ram_gb_llm: 24            # watchdog kills and restarts above this
