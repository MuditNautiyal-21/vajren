# Hardware profiles. core/hardware.py detects the machine and picks a tier from
# here; nothing else in VAJREN needs to know what GPU it is running on.
#
# THE POINT OF THIS FILE: VAJREN should survive being moved. New PC, a laptop, an
# NVIDIA card, a Mac, or a rebuilt machine after a reformat — detect, reconfigure,
# carry on. Only two things were ever AMD-specific: the backend and the disabled
# features. Both live here.

# ---------------------------------------------------------------------------
# Backends. Verified Sept 2026 — re-check when llama.cpp release assets change.
# ---------------------------------------------------------------------------
backends:

  cuda:
    detect: nvidia-smi present
    asset: "llama-*-bin-win-cuda-*-x64.zip"
    note: >
      Official releases ship CUDA 12 and CUDA 13 variants only — the cu11 builds
      were dropped in 2026. Pick by installed driver. This is the fastest and
      best-supported path; if Mudit ever moves to an NVIDIA card, everything gets
      easier, not harder.

  hip:
    detect: rocminfo lists a supported gfx target, on Linux
    asset: build from source, -DGGML_HIP=ON -DGPU_TARGETS=gfx110X|gfx120X
    note: >
      Do NOT assume ROCm beats Vulkan just because it is AMD's own stack. On RDNA4,
      Vulkan now measures 9-20% faster. Benchmark both before committing.
      RDNA2 and older (gfx1030/1031/1032/103x) are unsupported by the HIP SDK on
      every OS AMD currently ships — those go to Vulkan, full stop.

  vulkan:
    detect: vulkan-1.dll or vulkaninfo
    asset: "llama-*-bin-win-vulkan-x64.zip"
    note: >
      Needs nothing but the stock driver. The durable choice on AMD Windows and on
      any GPU whose vendor stack is unsupported or fragile. Carries two standing
      bugs — see disabled features below.

  metal:
    detect: Darwin + arm64
    asset: macOS arm64 release, Metal on by default
    note: >
      Unified memory means the weight budget is most of system RAM, and MoE expert
      offload has no PCIe hop — structurally cheaper than on a discrete GPU. A
      128 GB Mac is the most capable single portable machine in this whole table.

  sycl:
    detect: sycl-ls / Intel PCI vendor 8086
    asset: Ubuntu SYCL release, or the new OpenVINO backend
    note: >
      OpenVINO landed as a first-class llama.cpp backend in 2026 and covers Intel
      CPU/GPU/NPU — worth preferring on Core Ultra laptops. Vulkan is the fallback.

  cpu:
    detect: no usable GPU
    asset: "llama-*-bin-win-cpu-x64.zip"
    note: AVX2 is the safe baseline. Only the reflex lane is genuinely usable.

# ---------------------------------------------------------------------------
# Features that flip by backend. These are landmines, not preferences.
# ---------------------------------------------------------------------------
feature_gates:

  speculative_decoding:
    on: [cuda, metal, hip]
    off: [vulkan, cpu]
    why: >
      llama.cpp #23126 — Vulkan serialises draft and target models onto one queue.
      Measured collapse from 33 tok/s to 0.014 tok/s. Open, closed as not-planned.
      On CUDA this is a genuine speedup and should be enabled.

  mmproj_on_gpu:
    on: [cuda, metal]
    off: [vulkan, hip, cpu]
    why: >
      llama.cpp #20081 — Vulkan mmproj offload produces GARBLED vision output on
      AMD where CUDA and CPU are correct. A correctness bug, still open. Run the
      projector on CPU; keep the text model on the GPU.

  kv_cache_quant:
    on: [cuda, hip, vulkan, cpu]
    off: [metal]
    why: >
      llama.cpp #21450 — Metal has failed on mixed-quantised KV in 2026 builds.
      Use symmetric q8_0 for both K and V everywhere: asymmetric quant silently
      drops off the fused flash-attention path.

  faster_whisper_gpu:
    on: [cuda]
    off: [hip, vulkan, metal, sycl, cpu]
    why: >
      faster-whisper (CTranslate2) has a CUDA-only GPU path and falls back to CPU
      silently everywhere else. whisper.cpp has real backends on all platforms and
      is the portable default.

# ---------------------------------------------------------------------------
# Model tiers, chosen by VRAM — not by VRAM + RAM added together.
#
# Those two are not fungible, and treating them as one number is how you end up
# recommending a 32 GB model to a 12 GB card. VRAM is the hard constraint:
# attention, the KV cache and the MoE router must be resident. System RAM only
# buys expert offload, which works because just ~3B of a 35B model activates per
# token. So: tier by VRAM, and let RAM decide whether MoE offload is available.
# Apple is the exception — unified memory has no PCIe hop, so the pool is one
# budget and offload is structurally cheaper there.
#
# Lanes that cannot fit fall back to the free cloud cascade rather than degrading
# silently. That fallback is an explicit capability check, not an OOM crash.
# ---------------------------------------------------------------------------
tiers:

  cpu:              # no usable GPU
    reflex:  {model: gemma-4-E2B, quant: Q4_K_M, gb: 1.3}
    writer:  {model: gemma-4-E4B, quant: Q4_K_M, gb: 2.5}
    coder:   {fallback: cloud}
    planner: {fallback: cloud}
    tools:   {model: gemma-4-E4B, quant: Q4_K_M, gb: 2.5}
    vision:  {fallback: cloud}
    note: single digits to ~15 tok/s. Usable for routing and short drafts only.

  tiny:             # < 8 GB VRAM  (GTX 1660, RTX 3050, RX 6600)
    reflex:  {model: gemma-4-E4B, quant: Q4_K_M, gb: 2.5}
    writer:  {model: qwen3.6-27B, quant: IQ3, gb: 15}
    coder:   {model: gpt-oss-20b, quant: Q4_K_M, gb: 11.6, cpu_moe: true}
    planner: {model: gpt-oss-20b, quant: Q4_K_M, gb: 11.6, cpu_moe: true}
    tools:   {model: qwen3.6-35B-A3B, quant: Q4_K_M, gb: 22.1, cpu_moe: true}
    vision:  {model: qwen3-VL-4B, quant: Q4_K_M, gb: 3.5}

  small:            # 8-14 GB VRAM  <-- THIS MACHINE: RX 6750 XT, 12 GB + 32 GB RAM
    reflex:  {model: qwen3-4B-instruct-2507, quant: Q4_K_M, gb: 2.5}
    writer:  {model: gemma-4-31B-it, quant: Q4_K_M, gb: 18.5}
    coder:   {model: qwen3.6-35B-A3B, quant: Q4_K_M, gb: 22.1, cpu_moe: true}
    planner: {model: qwen3.6-35B-A3B, quant: Q4_K_M, gb: 22.1, cpu_moe: true, thinking: true}
    tools:   {model: glm-4.7-flash, quant: Q4_K_XL, gb: 17.5, cpu_moe: true}
    vision:  {model: qwen3-VL-8B-instruct, quant: Q4_K_M, gb: 6.0}

  mid:              # 14-26 GB VRAM  (RTX 3090/4090, RX 7900 XTX, 36 GB Mac)
    reflex:  {model: qwen3-4B-instruct-2507, quant: Q4_K_M, gb: 2.5}
    writer:  {model: qwen3.6-27B, quant: Q6_K, gb: 24}
    coder:   {model: glm-4.7-flash, quant: Q8_0, gb: 31.8}
    planner: {model: qwen3.6-35B-A3B, quant: Q6_K, gb: 29.3, thinking: true}
    tools:   {model: qwen3.6-35B-A3B, quant: Q6_K, gb: 29.3}
    vision:  {model: qwen3-VL-30B-A3B, quant: Q4_K_M, gb: 18}

  large:            # 26-50 GB VRAM  (RTX 5090, dual cards, 64 GB Mac)
    reflex:  {model: qwen3-4B-instruct-2507, quant: Q8_0, gb: 4.5}
    writer:  {model: qwen3.6-27B, quant: Q8_0, gb: 30}
    coder:   {model: gpt-oss-120b, quant: Q4_K_M, gb: 66, cpu_moe: true}
    planner: {model: gpt-oss-120b, quant: Q4_K_M, gb: 66, cpu_moe: true, thinking: true}
    tools:   {model: glm-4.7-flash, quant: Q8_0, gb: 31.8}
    vision:  {model: qwen3-VL-30B-A3B, quant: Q8_0, gb: 32}

  xlarge:           # 80 GB+ — rented GPU or a 128 GB Mac
    inherits: large
    coder:   {model: gpt-oss-120b, quant: Q8_0, gb: 120}
    note: fully GPU-resident, batching viable. Out of scope for a personal rig.

# ---------------------------------------------------------------------------
# Do not hard-pin these — they moved in 2026.
# ---------------------------------------------------------------------------
deprecated:
  devstral-small-2: >
    Mistral deprecated it on 2026-02-27 and points users at Mistral Medium 3.5.
    Do not make it the coder lane's long-term default. Qwen3.6-35B-A3B and
    GLM-4.7-Flash cover that lane.
  cuda-11-builds: >
    llama.cpp no longer ships cu11 release assets. CUDA 12 and 13 only.

# ---------------------------------------------------------------------------
# Offload sizing. Predict to narrow the range, then MEASURE.
# ---------------------------------------------------------------------------
sizing:
  method: predict-then-measure-then-cache
  predict: >
    oobabooga's regression over ~19,500 measured GGUF loads (median error 365 MiB)
    estimates VRAM from GGUF metadata: layers, kv heads, embedding dim, file size,
    context length and cache type. Add a ~577 MB safety buffer for ~95% load
    success. Good enough to pick where to start the sweep. Not good enough to trust.
  measure: >
    llama-bench sweeping -ngl / --n-cpu-moe on the actual hardware. Bisect around
    the OOM boundary rather than sweeping linearly - converges in 4-6 runs.
  cache: >
    Key on (hardware fingerprint + model hash + quant + context). Re-run only when
    one of those changes. This is why config/hardware.json exists.
  react: >
    Ollama's pattern, and the reason it survives real machines: catch the OOM at
    load, evict, retry with fewer layers. Never assume the prediction was right.
  rule: >
    More offload is NOT faster. --n-cpu-moe only helps when the alternative is
    silent VRAM overcommit and OS-level paging. Use the SMALLEST value that fits.
