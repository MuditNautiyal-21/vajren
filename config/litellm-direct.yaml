# LiteLLM proxy — DIRECT mode. One llama-server per model, no llama-swap.
#
# WHY THIS FILE EXISTS
#   config/litellm.yaml points every local route at llama-swap on :8080, which
#   loads models on demand. That is the destination. But 04-start-stack.ps1
#   starts llama-server processes directly on fixed ports and does NOT require
#   llama-swap, so with litellm.yaml the gateway comes up healthy, lists all
#   twelve routes, and then fails every request with "Connection error" - it is
#   talking to a port nobody is listening on. Healthy-looking and totally dead
#   is the worst failure mode there is, so the two modes get two files.
#
#   DIRECT (this file)  : ports 8081-8084, every started model always resident.
#                         Bounded by VRAM. Fine for 1-2 models.
#   SWAP (litellm.yaml) : port 8080, llama-swap rotates them. Needed at 3+.
#
#   Keep the route names identical between the two so nothing above the gateway
#   has to know which one is running.
#
# Ports must match the $plan block in scripts/04-start-stack.ps1.
#   8081 workhorse   8082 reflex   8083 tools   8084 writer

model_list:

  # ============ THE BENCH (all local, all private) ============
  - model_name: vajren-reflex          # 4B router/classifier — runs on the CPU
    litellm_params: {model: openai/reflex, api_base: http://127.0.0.1:8082/v1, api_key: "sk-local", timeout: 120}

  - model_name: vajren-workhorse       # coding + planning
    litellm_params: {model: openai/workhorse, api_base: http://127.0.0.1:8081/v1, api_key: "sk-local", timeout: 300}

  - model_name: vajren-writer          # email, outreach, posts
    litellm_params: {model: openai/writer, api_base: http://127.0.0.1:8084/v1, api_key: "sk-local", timeout: 300}

  - model_name: vajren-tools           # function calling / API orchestration
    litellm_params: {model: openai/tools, api_base: http://127.0.0.1:8083/v1, api_key: "sk-local", timeout: 300}

  - model_name: vajren-private         # generic local alias -> workhorse
    litellm_params: {model: openai/workhorse, api_base: http://127.0.0.1:8081/v1, api_key: "sk-local", timeout: 300}

  # ======================= PUBLIC LANE (local first, then free tiers) =======
  - model_name: vajren-public
    litellm_params:
      model: openai/workhorse
      api_base: http://127.0.0.1:8081/v1
      api_key: "sk-local"
      timeout: 300

  - model_name: vajren-public-groq
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      rpm: 28                       # provider says 30 — stay under

  - model_name: vajren-public-openrouter
    litellm_params:
      model: openrouter/z-ai/glm-4.7-flash:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 18                       # provider says 20

  - model_name: vajren-public-nvidia
    litellm_params:
      model: openai/deepseek-ai/deepseek-v4
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      rpm: 36                       # provider says 40 per key, across all models

  - model_name: vajren-public-zai
    litellm_params:
      model: openai/glm-4.7-flash
      api_base: https://api.z.ai/api/paas/v4
      api_key: os.environ/ZAI_API_KEY
      rpm: 5                        # free tier is concurrency-capped, be gentle

  - model_name: vajren-public-gemini
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 5
      # WARNING: Google's free tier is used for training AND human review.
      # Last in the chain on purpose. Never route anything personal here.

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  request_timeout: 300      # a 22 GB MoE at 30 tok/s needs room; 90 truncated it
  allowed_fails: 2
  cooldown_time: 120
  fallbacks:
    - vajren-public:
        - vajren-public-groq
        - vajren-public-openrouter
        - vajren-public-nvidia
        - vajren-public-zai
        - vajren-public-gemini
    - vajren-public-gemini: ["vajren-private"]
  context_window_fallbacks:
    - vajren-reflex: ["vajren-private"]
    - vajren-private: ["vajren-public-nvidia"]

litellm_settings:
  max_budget: 0.0           # HARD STOP: any billable call is refused
  drop_params: true
  set_verbose: false
  json_logs: true

general_settings:
  # bind to loopback only — this proxy holds every API key you own
  master_key: os.environ/LITELLM_MASTER_KEY
