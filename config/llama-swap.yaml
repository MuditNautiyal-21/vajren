# llama-swap — swaps the backing llama-server process based on the `model` field
# of each request. LiteLLM (:4000) talks to this (:8080); this talks to llama.cpp.
#
#   bin\llama-swap.exe --config config\llama-swap.yaml --listen 127.0.0.1:8080
#
# 12 GB of VRAM holds ONE ~20 GB-class model at a time. Two fit only because the
# reflex model is on the CPU. Three do not fit at all — which is why this file
# went from written-but-unused to load-bearing the day GLM-4.7 landed.
#
# ⚠ Every number here is MEASURED on this machine (J-029, J-031), not chosen.
#   Re-measure on any other machine: scripts\90-tune-moe.ps1.

healthCheckTimeout: 600      # a 20 GB model on --load-mode none is not quick
logLevel: info

macros:
  bin: "C:/vajren/llama/llama-server.exe"
  models: "C:/vajren/models"

  # ⚠ --device Vulkan0 is NOT optional. `--list-devices` reports two devices:
  #     Vulkan0: AMD Radeon RX 6750 XT   (12272 MiB)  <- the real card
  #     Vulkan1: AMD Radeon(TM) Graphics (16163 MiB)  <- the iGPU, quoting
  #                                                      shared system RAM
  #   The iGPU advertises MORE memory than the real card. Left to choose,
  #   llama.cpp can land on it and run at a fraction of the speed while still
  #   looking like it is "using a GPU". The index is not guaranteed on a new box.
  #
  # ⚠ --parallel 1. The default is FOUR slots, each with its own full KV cache,
  #   so --ctx-size 32768 silently becomes 131072 tokens of cache and eats the
  #   VRAM the experts need. Vajren serves one person.
  #
  # ⚠ --flash-attn on, KV cache at q8_0: halves cache size for no measurable
  #   quality cost at these context lengths.
  #
  # ⚠ NEVER add speculative decoding on Vulkan — a single-queue bug collapses
  #   throughput from 33 tok/s to 0.014 tok/s. llama.cpp #23126.
  #
  # ⚠ --cache-reuse 256 (added J-052, MEASURED). The first plan of every NEW
  #   turn re-read ~1,300 tokens at ~80 tok/s = 15-18 s, even though the memory,
  #   lessons and desktop-snapshot blocks were byte-identical to the last turn.
  #   Reason: the conversation block ahead of them grew by one turn, so every
  #   block after it shifted position and plain prefix-caching (which only keeps
  #   the unchanged HEAD) had to recompute all of it. --cache-reuse lets
  #   llama.cpp re-use cached chunks AFTER the divergence point once ≥256 tokens
  #   line up again, so a shifted-but-identical block is reused instead of
  #   recomputed. Pure latency win; identical output.
  gpu: "--host 127.0.0.1 --port ${PORT} --device Vulkan0 --parallel 1
        --flash-attn on --jinja --no-warmup --cache-type-k q8_0 --cache-type-v q8_0
        --cache-reuse 256"

  # ⚠ reflex runs on the CPU deliberately. On the GPU it is 6x faster in
  #   isolation (122 vs 20 tok/s) and costs the workhorse a third of ITS speed,
  #   because 2.6 GB resident pushes --n-cpu-moe from 26 to ~33. See J-029.
  #   Being on the CPU is also why it must never be given a long prompt: CPU
  #   prompt processing is 121 tok/s against the GPU's 1164, so the 4B is
  #   3x SLOWER than the 35B at planning. See J-031.
  cpu: "--host 127.0.0.1 --port ${PORT} --device none -ngl 0 --parallel 1
        --flash-attn on --jinja --no-warmup"

models:

  # ---- pinned. on the CPU, so it costs the GPU nothing to keep it resident. ----
  vajren-reflex:
    cmd: >
      ${bin} ${cpu}
      -m ${models}/Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf
      --ctx-size 8192
    ttl: 0
    aliases: [reflex, router]

  # ---- the workhorse: coding + planning share these weights ----
  # --n-cpu-moe 26 is measured: 20 hung the machine, 26 -> 30.6 tok/s,
  # 29 -> 25.4, 32 -> 20.7. Lower is faster until it overcommits, and
  # overcommitting on Windows does not error, it just crawls.
  # --load-mode none because mmap + expert offload page-faults during
  # inference; llama.cpp warns about this itself.
  vajren-workhorse:
    cmd: >
      ${bin} ${gpu}
      -m ${models}/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
      -ngl 999 --n-cpu-moe 26 --ctx-size 32768 --load-mode none
    ttl: 900
    aliases: [coder, planner, workhorse]

  # ---- GLM-4.7-Flash, 16.3 GB. MEASURED (scripts\90-tune-moe.ps1 -Bench -Tools):
  #
  #        n-cpu-moe |  pp512  |  tg128
  #            14    |  135.7  |  24.8
  #            18    |  127.5  |  28.7   <- generation peak
  #            22    |  264.4  |  27.3   <- prompt peak, 2x
  #
  # ⚠ The two lanes below share weights and DELIBERATELY differ in offload,
  #   because they have opposite workload shapes. Tool calling sends a long
  #   prompt (schemas, catalogue, context) and gets back a short structured
  #   answer — it lives on pp512, where 22 is nearly twice as fast. Writing
  #   sends a short prompt and generates paragraphs — it lives on tg128, where
  #   18 wins. One "correct" value for the model would be wrong for one of them.
  #
  #   18 was the pre-bench guess. It happens to be the tg peak, which is exactly
  #   the kind of luck that makes an unmeasured number look validated: it was
  #   also the worst of the three for prompt processing, on the lane that needs
  #   prompt processing most.
  vajren-tools:
    cmd: >
      ${bin} ${gpu}
      -m ${models}/GLM-4.7-Flash-UD-Q4_K_XL.gguf
      -ngl 999 --n-cpu-moe 22 --ctx-size 32768 --temp 0.2 --load-mode none
    ttl: 600
    aliases: [tools]

  # ---- writing: same weights, generation-heavy, so a different offload.
  vajren-writer-alt:
    cmd: >
      ${bin} ${gpu}
      -m ${models}/GLM-4.7-Flash-UD-Q4_K_XL.gguf
      -ngl 999 --n-cpu-moe 18 --ctx-size 16384 --temp 0.8 --top-p 0.95 --load-mode none
    ttl: 600
    aliases: [writer, vajren-writer]

  # ---- Gemma-4-31B: downloaded 2026-09-05, MEASURED, and parked.
  #      It is DENSE, 18.24 GiB Q4_K_M. A 12 GB card holds ~30 of its layers;
  #      the rest run on the CPU, and llama-bench says:
  #          ngl 30   pp64  1.02 t/s     tg24  2.36 t/s
  #      A 2k-token prompt would take half an hour to read. The MoE models
  #      work here because only ~3B of their weights are active per token;
  #      a dense 31B has no such trick. Kept on disk for a bigger card; the
  #      `writer` alias goes to GLM (28.7 t/s) so nothing ever waits on this.
  vajren-writer-gemma:
    cmd: >
      ${bin} ${gpu}
      -m ${models}/google_gemma-4-31B-it-Q4_K_M.gguf
      -ngl 30 --ctx-size 8192 --temp 0.8 --top-p 0.95
    ttl: 300

  # ---- vision. mmproj on CPU if Vulkan garbles it (llama.cpp #20081) ----
  vajren-vision:
    cmd: >
      ${bin} ${gpu}
      -m ${models}/Qwen3VL-8B-Instruct-Q4_K_M.gguf
      --mmproj ${models}/mmproj-Qwen3VL-8B-Instruct-Q8_0.gguf
      -ngl 999 --ctx-size 16384
    ttl: 600
    aliases: [vision]

groups:
  # reflex is on the CPU and never evicted — it competes with nothing.
  resident:
    swap: false
    exclusive: false
    members: [vajren-reflex]

  # everything here shares one 12 GB card, so exactly one may be loaded.
  specialists:
    swap: true
    exclusive: false
    members:
      - vajren-workhorse
      - vajren-tools
      - vajren-writer-gemma
      - vajren-writer-alt
      - vajren-vision
