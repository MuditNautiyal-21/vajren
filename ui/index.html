<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAJREN</title>
<style>
  :root{
    --bg:#05070c; --bg2:#0a0f1a; --ink:#dfe8f5; --dim:#6f7f96; --line:#16202f;
    --cyan:#4fd1ff; --cyan2:#1aa6e0; --amber:#ffb347; --red:#ff5c6c; --green:#4ade80;
    --mono:"Cascadia Code","JetBrains Mono",Consolas,monospace;
    --sans:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{background:radial-gradient(1200px 800px at 50% 40%,#0c1424 0%,var(--bg) 60%);color:var(--ink);
       font-family:var(--sans);overflow:hidden;display:grid;grid-template-columns:1fr 400px;grid-template-rows:1fr auto}
  #stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .name{position:relative;z-index:2;text-align:center;pointer-events:none;margin-top:52vh}
  .name h1{font-weight:200;letter-spacing:.55em;font-size:clamp(28px,4.2vw,52px);margin:0 0 .3em .55em;
           color:#fff;text-shadow:0 0 24px rgba(79,209,255,.55),0 0 60px rgba(79,209,255,.25)}
  .name .tag{font-family:var(--mono);font-size:11px;letter-spacing:.32em;color:var(--dim);text-transform:uppercase}
  .state{font-family:var(--mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;margin-top:14px;
         color:var(--cyan);transition:color .3s}
  .state[data-s=awaiting_approval]{color:var(--amber)} .state[data-s=error]{color:var(--red)}
  .state[data-s=listening]{color:var(--green)}
  aside{border-left:1px solid var(--line);background:linear-gradient(180deg,rgba(10,15,26,.9),rgba(5,7,12,.95));
        display:flex;flex-direction:column;min-height:0}
  aside header{padding:14px 18px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;
               color:var(--dim);display:flex;justify-content:space-between;letter-spacing:.08em}
  #log{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.45}
  .m{max-width:100%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
  .m.you{align-self:flex-end;background:#132033;border:1px solid #1d2f4a;color:#e8f0fb}
  .m.vaj{align-self:flex-start;background:#0b1522;border:1px solid #14283d;color:#cfe6f7}
  .m.sys{align-self:center;color:var(--dim);font-family:var(--mono);font-size:11px;background:none;padding:2px 0}
  .m.step{align-self:stretch;font-family:var(--mono);font-size:12px;background:#0a0f18;border:1px dashed #1a2738;color:#9fb3cc}
  .m.step.ok::before{content:"✓ ";color:var(--green)} .m.step.bad::before{content:"✗ ";color:var(--red)}
  .m.warn{align-self:stretch;background:#2a1414;border:1px solid #5a1f28;color:#ffb4bc;font-size:13px}
  .m .meta{display:block;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:4px;letter-spacing:.06em}
  footer{grid-column:1/3;border-top:1px solid var(--line);background:rgba(5,7,12,.92);padding:14px 22px;
         display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
  button{font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;font-size:12px;border-radius:999px;
         border:1px solid #1d2f4a;background:#0d1626;color:var(--ink);padding:12px 22px;cursor:pointer;transition:all .15s}
  button:hover{border-color:var(--cyan2)} button:disabled{opacity:.35;cursor:default}
  #talk{border-color:var(--cyan2);color:var(--cyan);padding:16px 30px;font-size:13px;user-select:none;min-width:250px}
  #talk.live{background:radial-gradient(circle,#0d2f3f,#0d1626);box-shadow:0 0 30px rgba(79,209,255,.35);color:#fff}
  #talk.free{border-color:var(--green);color:var(--green)}
  .gate{display:none;gap:10px} .gate.open{display:flex}
  #approve{border-color:#2f6b3f;color:var(--green)} #cancel{border-color:#6b2f37;color:var(--red)}
  #approve:hover{background:#10251a} #cancel:hover{background:#2a1418}
  form{display:flex;gap:10px} input{flex:1;background:#0a0f18;border:1px solid var(--line);border-radius:999px;
       color:var(--ink);padding:12px 18px;font-size:14px;font-family:var(--sans);outline:none}
  input:focus{border-color:var(--cyan2)}
  .lat{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right;line-height:1.6}
  .lat b{color:var(--ink);font-weight:500}
  #hint{position:absolute;bottom:18px;left:22px;z-index:2;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.08em}
</style>
</head>
<body>
<section id="stage">
  <canvas id="c"></canvas>
  <div class="name"><h1>VAJREN</h1><div class="tag">local · private · asks first</div>
    <div class="state" id="state" data-s="idle">connecting</div></div>
  <div id="hint">hold <b>SPACE</b> or the button to talk · release to send · <b>H</b> hands-free</div>
</section>
<aside>
  <header><span id="sess">session —</span><span id="voiceok">voice —</span></header>
  <div id="log"></div>
</aside>
<footer>
  <button id="talk">● hold to talk</button>
  <form id="f"><input id="t" placeholder="or type here and press Enter" autocomplete="off"><button type="submit">send</button></form>
  <div style="display:flex;gap:14px;align-items:center">
    <div class="gate" id="gate"><button id="approve">yes go ahead</button><button id="cancel">cancel</button></div>
    <div class="lat"><span>stt <b id="l_stt">—</b></span> · <span>think <b id="l_think">—</b></span> · <span>tts <b id="l_tts">—</b></span></div>
  </div>
</footer>
<script>
// ============================================================ state & wire ==
const $ = s => document.querySelector(s);
const log = $('#log'), stateEl = $('#state'), talk = $('#talk'), gate = $('#gate');
let ws, state = 'idle', gateOpen = false, handsFree = false;
let tSpeechEnd = 0, tHeard = 0;                 // for the latency readouts

function setState(s){ state = s; stateEl.dataset.s = s; stateEl.textContent = s.replace('_',' '); }
function add(cls, text, meta){
  const d = document.createElement('div'); d.className = 'm ' + cls; d.textContent = text;
  if (meta){ const m = document.createElement('span'); m.className='meta'; m.textContent = meta; d.appendChild(m); }
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function connect(){
  ws = new WebSocket(`ws://${location.host}/ws`); ws.binaryType = 'arraybuffer';
  ws.onopen  = () => add('sys', 'connected');
  ws.onclose = () => { setState('error'); add('sys', 'disconnected — retrying'); setTimeout(connect, 1500); };
  ws.onmessage = ev => {
    if (ev.data instanceof ArrayBuffer) return playWav(ev.data);
    const m = JSON.parse(ev.data);
    switch (m.type){
      case 'hello':
        $('#sess').textContent = 'session ' + m.session;
        const v = m.voice; $('#voiceok').textContent =
          `tts ${v.tts?'✓':'✗'} · stt ${v.stt?'✓':'✗'} · audio ${v.audio?'✓':'✗'}`;
        if (v.devices) add('sys', `mic: ${v.devices.input_name}\nout: ${v.devices.output_name}`);
        break;
      case 'state':
        if (!(m.state==='idle' && capturing)) setState(m.state);
        gateOpen = (m.state === 'awaiting_approval'); gate.classList.toggle('open', gateOpen);
        if (m.state === 'thinking') tHeard = performance.now();
        break;
      case 'heard':
        if (tSpeechEnd) $('#l_stt').textContent = ((performance.now()-tSpeechEnd)/1000).toFixed(1)+'s';
        add('you', m.text || '(nothing heard)', `conf ${Number(m.conf).toFixed(2)}` + (m.verdict ? ` · ${m.verdict}` : ''));
        break;
      case 'say':
        if (tHeard) $('#l_think').textContent = ((performance.now()-tHeard)/1000).toFixed(1)+'s';
        add('vaj', m.text); break;
      case 'ask':  break;                        // the 'say' carries the text
      case 'step':
        add('step ' + (m.verified ? 'ok' : 'bad'),
            `${m.tool}(${Object.entries(m.args||{}).map(([k,v])=>k+'='+JSON.stringify(String(v)).slice(0,60)).join(', ')})`
            + (m.error ? '\n   ' + m.error : ''));
        if (m.injection) add('warn', '⚠ that data contained an instruction aimed at me. Ignored, and reported.');
        break;
      case 'done':  add('sys', `done · ${m.elapsed}s`); break;
      case 'busy':  add('sys', 'still working on the last one'); break;
      case 'error': add('warn', m.text); break;
    }
  };
}
connect();

// ================================================================= audio ==
// One AudioContext for everything. 16 kHz so the mic arrives at the rate
// Whisper wants and the browser does the resampling, not us.
let ctx, micStream, micSrc, proc, micAnalyser, outAnalyser;
let capturing = false, chunks = [], captureStart = 0;
const SR = 16000;

async function ensureAudio(){
  if (ctx) return true;
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SR });
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true,
                                                                      noiseSuppression: true, autoGainControl: true } });
    micSrc = ctx.createMediaStreamSource(micStream);
    micAnalyser = ctx.createAnalyser(); micAnalyser.fftSize = 1024;
    outAnalyser = ctx.createAnalyser(); outAnalyser.fftSize = 2048; outAnalyser.smoothingTimeConstant = .82;
    proc = ctx.createScriptProcessor(2048, 1, 1);
    proc.onaudioprocess = e => {
      const x = e.inputBuffer.getChannelData(0);
      if (capturing) chunks.push(new Float32Array(x));
      else if (handsFree) vadTick(x);
    };
    micSrc.connect(micAnalyser); micAnalyser.connect(proc); proc.connect(ctx.destination);
    outAnalyser.connect(ctx.destination);
    return true;
  } catch (e){ add('warn', 'microphone unavailable: ' + e.message + ' — type instead'); return false; }
}

function startCapture(){
  if (capturing || !ctx) return;
  if (state === 'speaking' || state === 'thinking' || state === 'transcribing') return; // never talk over it
  capturing = true; chunks = []; captureStart = performance.now();
  talk.classList.add('live'); talk.textContent = '● listening… release to send'; setState('listening');
}
function stopCapture(){
  if (!capturing) return;
  capturing = false; talk.classList.remove('live'); talk.textContent = handsFree ? '● hands-free' : '● hold to talk';
  const n = chunks.reduce((a,c)=>a+c.length,0);
  const out = new Float32Array(n); let o=0; for (const c of chunks){ out.set(c,o); o+=c.length; }
  chunks = [];
  if (n < SR*0.3){ setState(gateOpen?'awaiting_approval':'idle'); return; }
  tSpeechEnd = performance.now();
  ws.send(out.buffer);                          // one utterance, one binary frame
  setState('transcribing');
}

// hands-free: an RMS gate against a running noise floor — same idea as core/voice.py
let noise = 0.004, quiet = 0, speaking = false;
function vadTick(x){
  let s=0; for (let i=0;i<x.length;i++) s+=x[i]*x[i]; const rms = Math.sqrt(s/x.length);
  if (!speaking){ noise = noise*0.98 + rms*0.02; }
  const gateLvl = Math.max(noise*3.5, 0.008);
  if (rms > gateLvl){ if (!speaking){ speaking = true; startCapture(); } quiet = 0; }
  else if (speaking){ quiet += x.length/SR; if (quiet > 1.1){ speaking=false; stopCapture(); } }
}

async function playWav(buf){
  if (!(await ensureAudio())) { ws.send(JSON.stringify({type:'played'})); return; }
  let audio; try { audio = await ctx.decodeAudioData(buf.slice(0)); } catch(e){ ws.send(JSON.stringify({type:'played'})); return; }
  const src = ctx.createBufferSource(); src.buffer = audio; src.connect(outAnalyser);
  const t0 = performance.now();
  src.onended = () => { $('#l_tts').textContent = (audio.duration).toFixed(1)+'s'; ws.send(JSON.stringify({type:'played'})); };
  src.start();
}
</script>
<script>
// ============================================================== controls ==
async function pressStart(e){ e && e.preventDefault(); if (await ensureAudio()) { ctx.resume(); if (!handsFree) startCapture(); } }
function pressEnd(e){ e && e.preventDefault(); if (!handsFree) stopCapture(); }
talk.addEventListener('mousedown', pressStart); talk.addEventListener('mouseup', pressEnd);
talk.addEventListener('mouseleave', pressEnd); talk.addEventListener('touchstart', pressStart, {passive:false});
talk.addEventListener('touchend', pressEnd);
let spaceDown = false;
window.addEventListener('keydown', async e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space' && !spaceDown){ spaceDown = true; pressStart(e); }
  if (e.key === 'h' || e.key === 'H'){ toggleHandsFree(); }
  if (gateOpen && (e.key === 'y' || e.key === 'Y')) ws.send(JSON.stringify({type:'approve'}));
  if (gateOpen && (e.key === 'n' || e.key === 'N' || e.key === 'Escape')) ws.send(JSON.stringify({type:'cancel'}));
});
window.addEventListener('keyup', e => { if (e.code === 'Space'){ spaceDown = false; pressEnd(e); } });
async function toggleHandsFree(){
  if (!(await ensureAudio())) return; ctx.resume();
  handsFree = !handsFree; talk.classList.toggle('free', handsFree);
  talk.textContent = handsFree ? '● hands-free' : '● hold to talk';
  add('sys', handsFree ? 'hands-free on — just talk; it sends when you pause' : 'hands-free off — hold to talk');
}
$('#f').addEventListener('submit', e => {
  e.preventDefault(); const v = $('#t').value.trim(); if (!v) return;
  $('#t').value = ''; tSpeechEnd = 0; ws.send(JSON.stringify({type:'text', text:v}));
});
$('#approve').onclick = () => ws.send(JSON.stringify({type:'approve'}));
$('#cancel').onclick  = () => ws.send(JSON.stringify({type:'cancel'}));

// ================================================================ the face ==
// A core that breathes when idle, listens in green, thinks in rotating arcs,
// waits for approval in amber, and — when Vajren speaks — moves with the real
// amplitude of its own voice. Nothing here is a canned loop; the speaking
// motion is the AnalyserNode on the TTS audio, frame by frame.
const cv = $('#c'), g = cv.getContext('2d');
let W, H, t = 0;
function resize(){ const r = cv.parentElement.getBoundingClientRect(); cv.width = r.width*devicePixelRatio; cv.height = r.height*devicePixelRatio;
                   g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); W=r.width; H=r.height; }
addEventListener('resize', resize); resize();
const N = 96, ring = new Float32Array(N), freq = new Uint8Array(1024), wave = new Uint8Array(2048);
const stars = Array.from({length:140}, () => ({x:Math.random(), y:Math.random(), r:Math.random()*1.2+.3, s:Math.random()*.4+.1}));
const PALETTE = { idle:[79,209,255], listening:[74,222,128], transcribing:[74,222,128], thinking:[79,209,255],
                  awaiting_approval:[255,179,71], speaking:[120,225,255], error:[255,92,108] };
let amp = 0, ampTarget = 0, col = [79,209,255];

function level(){
  if (state === 'speaking' && outAnalyser){
    outAnalyser.getByteFrequencyData(freq);
    let s=0; for (let i=2;i<200;i++) s+=freq[i]; return Math.min(1, (s/198)/110);
  }
  if ((state === 'listening' || capturing) && micAnalyser){
    micAnalyser.getByteTimeDomainData(wave.subarray(0,1024));
    let s=0; for (let i=0;i<1024;i++){ const v=(wave[i]-128)/128; s+=v*v; } return Math.min(1, Math.sqrt(s/1024)*6);
  }
  return 0;
}
function draw(){
  requestAnimationFrame(draw); t += 0.016;
  const cx = W/2, cy = H*0.42, R = Math.min(W,H)*0.17;
  ampTarget = level(); amp += (ampTarget-amp)*(ampTarget>amp?0.35:0.08);
  const target = PALETTE[state] || PALETTE.idle; for (let i=0;i<3;i++) col[i] += (target[i]-col[i])*0.06;
  const c = (a=1) => `rgba(${col[0]|0},${col[1]|0},${col[2]|0},${a})`;

  g.clearRect(0,0,W,H);
  for (const s of stars){ const y = (s.y + t*s.s*0.01)%1; g.fillStyle=`rgba(200,220,255,${0.25*s.r})`; g.beginPath(); g.arc(s.x*W, y*H, s.r, 0, 7); g.fill(); }

  const breathe = 1 + Math.sin(t*1.1)*0.025 + amp*0.35;
  // outer haze
  const hz = g.createRadialGradient(cx,cy,R*0.6,cx,cy,R*2.6); hz.addColorStop(0,c(0.16+amp*0.25)); hz.addColorStop(1,c(0));
  g.fillStyle = hz; g.beginPath(); g.arc(cx,cy,R*2.6,0,7); g.fill();

  // spectrum ring: the outline moves with the voice
  if (state === 'speaking' && outAnalyser) outAnalyser.getByteFrequencyData(freq);
  g.lineWidth = 1.6; g.strokeStyle = c(0.9); g.beginPath();
  for (let i=0;i<=N;i++){
    const k = i%N, a = (k/N)*Math.PI*2 - Math.PI/2;
    const f = state==='speaking' ? freq[8 + (k*3)%180]/255 : 0;
    const wob = Math.sin(t*2.2 + k*0.35)*0.02 + Math.sin(t*0.7 + k*0.11)*0.015;
    ring[k] += ((f*0.55 + wob + (state==='listening'?amp*0.4:0)) - ring[k]) * 0.3;
    const r = R*breathe*(1 + ring[k]);
    i ? g.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r) : g.moveTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r);
  }
  g.closePath(); g.stroke();
  const fill = g.createRadialGradient(cx,cy,0,cx,cy,R*breathe); fill.addColorStop(0,c(0.35+amp*0.4)); fill.addColorStop(0.7,c(0.08)); fill.addColorStop(1,c(0));
  g.fillStyle = fill; g.fill();

  // thinking: two counter-rotating arcs. approval: a slow amber pulse ring.
  if (state === 'thinking' || state === 'transcribing'){
    for (let j=0;j<2;j++){ g.lineWidth=2; g.strokeStyle=c(0.7); g.beginPath();
      const s0 = t*(j?-1.6:2.3) + j*Math.PI; g.arc(cx,cy,R*(1.35+j*0.18), s0, s0+Math.PI*0.55); g.stroke(); }
  }
  if (state === 'awaiting_approval'){
    const p = (Math.sin(t*2.5)+1)/2; g.lineWidth=1.5+p*2; g.strokeStyle=c(0.35+p*0.5);
    g.beginPath(); g.arc(cx,cy,R*(1.45+p*0.08),0,7); g.stroke();
  }
  // orbiting motes
  for (let i=0;i<7;i++){ const a = t*(0.25+i*0.05)+i*0.9, r = R*(1.7+Math.sin(t*0.6+i)*0.12);
    g.fillStyle=c(0.5); g.beginPath(); g.arc(cx+Math.cos(a)*r, cy+Math.sin(a)*r*0.72, 1.6+amp*2, 0, 7); g.fill(); }
  // inner core
  g.fillStyle = `rgba(255,255,255,${0.55+amp*0.4})`; g.beginPath(); g.arc(cx,cy,R*0.11*(1+amp*0.8),0,7); g.fill();
}
draw();
</script>
</body>
</html>
