<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAJREN</title>
<style>
/* ============================================================================
   The face, v2 (2026-09-05). Three columns and a dock.

     left    what Vajren PERCEIVES — the desktop, what it remembers, what
             it has earned the right to do without asking. Live data, so
             the reasons for an action are visible before the action.
     centre  the orb (one thing: state), the wordmark, the state word —
             the loudest text on screen, because "is it waiting for me?"
             is the question asked a dozen times a session.
     right   the conversation: what it heard, what it DID in plain words,
             what it said, and the approval card carrying the exact action.
     dock    hold-to-talk, mic level, typed fallback, yes/cancel fallback.

   Deliberately absent (the "hard case" pass): model pills, latency
   readouts, GPU/memory telemetry, session score, orb ticks/dust/motes,
   a decorative waveform. Everything on screen changes what Mudit does
   or knows at the moment he is looking at it.
   ========================================================================= */
:root{
  --bg:#05070c; --panel:rgba(12,17,27,.78); --line:rgba(120,160,210,.13); --line2:rgba(120,160,210,.28);
  --ink:#dfe8f4; --dim:#8fa3bd; --dim2:#55677f;
  --cy:#5fe3ff; --cy2:#1fb6d6; --am:#ffb454; --rd:#ff5f6d; --gr:#6ee7a7; --vi:#a78bfa;
  --mono:"Cascadia Code","JetBrains Mono",Consolas,ui-monospace,monospace;
  --sans:Inter,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
     display:grid;grid-template-columns:320px 1fr 440px;grid-template-rows:48px 1fr 86px;gap:0}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 600px at 50% 42%,rgba(31,182,214,.09),transparent 60%),
             radial-gradient(1200px 500px at 50% 110%,rgba(31,182,214,.05),transparent 60%)}
button{font-family:var(--mono);font-size:11px;letter-spacing:.1em;padding:9px 16px;border-radius:9px;
       border:1px solid var(--line2);background:transparent;color:var(--dim);cursor:pointer;transition:.15s}
button:hover{color:var(--ink);border-color:var(--cy)}

/* ---------------- top ---------------- */
.top{grid-column:1/4;display:flex;align-items:center;justify-content:space-between;padding:0 24px;
     border-bottom:1px solid var(--line);position:relative;z-index:1}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.32em;color:var(--dim)}
.brand b{color:var(--cy);font-weight:500}
.ready{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--dim);border:1px solid var(--line2);
       border-radius:999px;padding:5px 11px;display:flex;align-items:center;gap:7px}
.ready i{width:6px;height:6px;border-radius:50%;background:var(--dim2)}
.ready.on i{background:var(--gr);box-shadow:0 0 8px var(--gr)} .ready.bad i{background:var(--rd);box-shadow:0 0 8px var(--rd)}

/* ---------------- columns ---------------- */
aside{position:relative;z-index:1;padding:20px 0 20px 24px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
aside.right{padding:20px 24px 20px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;backdrop-filter:blur(10px)}
.card.fill{flex:1;min-height:0;display:flex;flex-direction:column}
.h{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim2);
   margin-bottom:10px;display:flex;justify-content:space-between}
.h span{letter-spacing:.05em;text-transform:none}
.row{display:flex;align-items:center;gap:9px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--dim);min-width:0}
.row:first-of-type{border-top:0}
.row .k{font-family:var(--mono);font-size:10px;color:var(--dim2);width:62px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.front .v{color:var(--ink);font-weight:500}
.tag{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--dim2);margin-left:auto;flex:none}
.tag.front{color:var(--cy);border-color:rgba(95,227,255,.45)}
.fact{font-size:12.5px;color:var(--dim);padding:6px 0;border-top:1px solid var(--line);line-height:1.4}
.fact:first-of-type{border-top:0} .fact i{color:var(--dim2);font-style:normal;font-family:var(--mono);font-size:9.5px;margin-right:7px}
.tbar{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--dim);padding:5px 0}
.tbar .m{font-family:var(--mono);font-size:10px;color:var(--dim2);width:118px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter{flex:1;height:4px;border-radius:2px;background:rgba(120,160,210,.15);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--cy2),var(--cy));border-radius:2px}
.tbar .n{font-family:var(--mono);font-size:9.5px;color:var(--dim2);width:44px;text-align:right;flex:none}
.tbar .n.g{color:var(--gr)}
.empty{font-size:12px;color:var(--dim2);padding:4px 0}

/* ---------------- stage ---------------- */
#stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%}
.wordmark{position:relative;margin-top:22px;text-align:center;pointer-events:none}
.wordmark h2{font-family:var(--mono);font-weight:500;font-size:30px;letter-spacing:.42em;color:var(--ink);text-shadow:0 0 30px rgba(95,227,255,.25);padding-left:.42em}
.wordmark .rule{width:220px;height:1px;margin:16px auto 0;background:linear-gradient(90deg,transparent,var(--line2),transparent)}
.readout{position:absolute;left:0;right:0;bottom:8%;text-align:center;pointer-events:none;padding:0 30px}
.rstate{font-family:var(--mono);font-size:15px;letter-spacing:.34em;font-weight:500;padding-left:.34em;transition:color .3s}
.rstate[data-s=idle]{color:var(--dim)} .rstate[data-s=listening]{color:var(--gr)} .rstate[data-s=transcribing]{color:var(--gr)}
.rstate[data-s=thinking]{color:var(--cy)} .rstate[data-s=awaiting_approval]{color:var(--am)}
.rstate[data-s=error]{color:var(--rd)} .rstate[data-s=speaking]{color:#bff7ff}
.rsub{margin-top:10px;font-size:14.5px;color:var(--dim);max-width:560px;margin-left:auto;margin-right:auto;line-height:1.5;min-height:1.5em}

/* ---------------- conversation ---------------- */
#log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding-right:4px;scrollbar-width:thin;scrollbar-color:#1c2a3d transparent}
.m{max-width:100%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;animation:in .18s both}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.m.you{align-self:flex-end;background:rgba(31,182,214,.10);border:1px solid rgba(95,227,255,.22);border-bottom-right-radius:4px}
.m.you.low{opacity:.6}
.m.vaj{align-self:flex-start;background:rgba(255,255,255,.03);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.sys{align-self:center;font-family:var(--mono);font-size:10px;color:var(--dim2);letter-spacing:.08em;padding:1px}
.m.step{align-self:stretch;font-family:var(--mono);font-size:11px;color:var(--dim);padding:5px 10px;
        border-left:2px solid rgba(95,227,255,.45);background:rgba(95,227,255,.04);border-radius:0 8px 8px 0}
.m.step .t{color:var(--cy)} .m.step.bad{border-left-color:rgba(255,95,109,.6);background:rgba(255,95,109,.05)} .m.step.bad .t{color:var(--rd)}
.m.warn{align-self:stretch;background:#241016;border:1px solid #5c1f2a;color:#ffb9c0;font-size:12.5px}
.m .meta{display:block;font-family:var(--mono);font-size:9.5px;color:var(--dim2);margin-top:5px;letter-spacing:.05em}
/* ⚠ The approval card is a SAFETY surface: the exact argument that will run,
   verbatim, because the spoken line is allowed to abbreviate it. */
.m.ask{align-self:stretch;border:1px solid rgba(255,180,84,.5);background:linear-gradient(180deg,rgba(255,180,84,.10),rgba(255,180,84,.04));color:var(--ink)}
.m.ask .h{color:var(--am);margin-bottom:6px}
.m.ask .lit{display:block;font-family:var(--mono);font-size:11px;line-height:1.55;color:#ffe9c4;background:rgba(0,0,0,.35);
  border:1px solid rgba(255,180,84,.35);border-radius:8px;padding:7px 9px;margin-top:8px;white-space:pre-wrap;word-break:break-all;max-height:9.5em;overflow:auto}
.m.ask .hint{display:block;margin-top:7px;font-size:11px;color:var(--dim2);font-family:var(--sans)}

/* ---------------- dock ---------------- */
.dock{grid-column:1/4;position:relative;z-index:1;margin:0 24px 18px;border:1px solid var(--line);border-radius:16px;
      background:var(--panel);backdrop-filter:blur(10px);display:flex;align-items:center;padding:0 16px;gap:14px}
#talk{position:relative;flex:none;width:46px;height:46px;border-radius:50%;padding:0;border:1px solid rgba(95,227,255,.55);
      background:radial-gradient(circle at 50% 40%,rgba(95,227,255,.32),rgba(95,227,255,.05));box-shadow:0 0 22px rgba(95,227,255,.22);
      color:#bff7ff;font-size:16px;display:flex;align-items:center;justify-content:center;overflow:visible}
#talk.live{border-color:var(--gr);box-shadow:0 0 26px rgba(110,231,167,.4);color:var(--gr)}
#talk.free{border-color:var(--vi);color:var(--vi)}
.lvlwrap{width:120px;height:6px;border-radius:3px;background:rgba(120,160,210,.15);overflow:hidden;flex:none}
#lvl{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy2),var(--gr));transition:width .06s}
.hint2{font-family:var(--mono);font-size:10.5px;color:var(--dim2);letter-spacing:.06em;white-space:nowrap}
.hint2 b{color:var(--dim);font-weight:500}
form{flex:1;display:flex;gap:10px;min-width:160px}
input,select{background:#070d16;border:1px solid var(--line);border-radius:999px;color:var(--ink);padding:10px 15px;font-size:13px;font-family:var(--sans);outline:none}
input{flex:1} input:focus,select:focus{border-color:var(--cy2)}
select{font-family:var(--mono);font-size:10.5px;color:var(--dim);max-width:180px;cursor:pointer}
.gate{display:none;gap:8px} .gate.open{display:flex;animation:in .2s both}
#ok{border-color:rgba(110,231,167,.6);color:var(--gr)} #no{border-color:rgba(255,95,109,.5);color:var(--rd)}
#ok:hover{background:#0d2417} #no:hover{background:#241016}
</style>
</head>
<body>

<div class="top">
  <div class="brand"><b>VAJREN</b></div>
  <div class="ready" id="ready"><i></i><span>connecting</span></div>
</div>

<aside class="left">
  <div class="card">
    <div class="h">On the desktop <span id="dwhen"></span></div>
    <div id="desk"><div class="empty">—</div></div>
  </div>
  <div class="card">
    <div class="h">Remembered <span id="fcount"></span></div>
    <div id="facts"><div class="empty">nothing recalled for this request</div></div>
  </div>
  <div class="card">
    <div class="h">Earned trust</div>
    <div id="trust"><div class="empty">everything still asks</div></div>
    <div class="empty" style="margin-top:8px;font-size:11px">three yeses to a shape and it stops asking · “ask me about that again” revokes</div>
  </div>
</aside>

<section id="stage">
  <canvas id="c"></canvas>
  <div class="wordmark"><h2>VAJREN</h2><div class="rule"></div></div>
  <div class="readout"><div class="rstate" id="rstate" data-s="idle">CONNECTING</div><div class="rsub" id="rsub">—</div></div>
</section>

<aside class="right">
  <div class="card fill">
    <div class="h">Conversation <span id="sess"></span></div>
    <div id="log"></div>
  </div>
</aside>

<div class="dock">
  <button id="talk" title="hold to talk (SPACE)">◉</button>
  <div class="lvlwrap"><span id="lvl"></span></div>
  <div class="hint2" id="talkhint"><b>hold</b> to talk · <b>SPACE</b> works too · <b>H</b> hands-free</div>
  <form id="f"><input id="t" placeholder="…or type here" autocomplete="off"><button type="submit">send</button></form>
  <select id="mics" title="microphone"></select>
  <div class="gate" id="gate"><button id="ok">yes</button><button id="no">cancel</button></div>
</div>

<script>
const $=s=>document.querySelector(s), log=$('#log');
let ws, state='idle', gateOpen=false, handsFree=false, turns=0, tEnd=0;

const WORD={idle:'READY',listening:'LISTENING',transcribing:'HEARING YOU',thinking:'THINKING',
            awaiting_approval:'WAITING FOR YOU',speaking:'SPEAKING',error:'NOT CONNECTED'};
function setState(s,sub){ state=s; const r=$('#rstate'); r.dataset.s=s; r.textContent=WORD[s]||s.toUpperCase();
  if(sub!==undefined)$('#rsub').textContent=sub; }
function ready(on,txt){const e=$('#ready');e.classList.toggle('on',on===true);e.classList.toggle('bad',on===false);
  if(txt)e.lastElementChild.textContent=txt;}

function add(cls,text,meta,literal){const d=document.createElement('div');d.className='m '+cls;
  if(cls.startsWith('step')){const s=document.createElement('span');s.className='t';s.textContent=(cls.includes('bad')?'✗ ':'✓ ');d.appendChild(s);}
  if(cls==='ask'){const h=document.createElement('span');h.className='h';h.textContent='permission';
    if(meta){const sp=document.createElement('span');sp.textContent=meta;h.appendChild(sp);} d.appendChild(h);meta=null;}
  d.appendChild(document.createTextNode(text));
  // textContent, never innerHTML — this string came from a model that may have
  // been reading an untrusted file, and it sits next to a Yes button.
  if(literal){const l=document.createElement('span');l.className='lit';l.textContent=literal;d.appendChild(l);}
  if(meta){const m=document.createElement('span');m.className='meta';m.textContent=meta;d.appendChild(m);}
  if(cls==='ask'){const hn=document.createElement('span');hn.className='hint';hn.textContent='yes, sure, okay, go ahead — or no, cancel, stop';d.appendChild(hn);}
  log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}

// ------------------------------------------------------------ left column --
function esc(s){return String(s==null?'':s);}
function renderContext(m){
  const desk=$('#desk'); desk.innerHTML='';
  const wins=(m.windows||[]).slice(0,9);
  if(!wins.length&&!m.own_browser){desk.innerHTML='<div class="empty">nothing open</div>';}
  for(const w of wins){const r=document.createElement('div');r.className='row'+(w.foreground?' front':'');
    const k=document.createElement('span');k.className='k';k.textContent=esc(w.app||'?');
    const v=document.createElement('span');v.className='v';v.textContent=esc(w.title);
    r.appendChild(k);r.appendChild(v);
    if(w.foreground){const t=document.createElement('span');t.className='tag front';t.textContent='FRONT';r.appendChild(t);}
    else if(w.minimized){const t=document.createElement('span');t.className='tag';t.textContent='min';r.appendChild(t);}
    desk.appendChild(r);}
  if(m.own_browser){const r=document.createElement('div');r.className='row';
    const k=document.createElement('span');k.className='k';k.textContent='vajren';
    const v=document.createElement('span');v.className='v';v.textContent='my browser · '+esc(m.own_browser.title||m.own_browser.url);
    r.appendChild(k);r.appendChild(v);desk.appendChild(r);}
  $('#dwhen').textContent='just now';

  const facts=$('#facts'); facts.innerHTML='';
  if(!(m.facts||[]).length){facts.innerHTML='<div class="empty">nothing recalled for this request</div>';}
  for(const f of (m.facts||[])){const d=document.createElement('div');d.className='fact';
    const i=document.createElement('i');i.textContent=esc(f.source);d.appendChild(i);d.appendChild(document.createTextNode(esc(f.fact)));facts.appendChild(d);}
  $('#fcount').textContent=(m.fact_total||0)+' kept';

  const tr=$('#trust'); tr.innerHTML='';
  const rows=(m.trust||[]).filter(t=>t.approvals>0||t.granted_at);
  if(!rows.length){tr.innerHTML='<div class="empty">everything still asks</div>';}
  for(const t of rows){const d=document.createElement('div');d.className='tbar';
    const mm=document.createElement('span');mm.className='m';mm.textContent=esc(t.tool)+' · '+esc(t.pattern).split(/[\\/]/).pop();
    const me=document.createElement('div');me.className='meter';const bar=document.createElement('i');
    const pct=t.granted_at?100:Math.min(100,Math.round(100*t.approvals/3));bar.style.width=pct+'%';me.appendChild(bar);
    const n=document.createElement('span');n.className='n'+(t.granted_at?' g':'');n.textContent=t.granted_at?'granted':(t.approvals+' / 3');
    d.appendChild(mm);d.appendChild(me);d.appendChild(n);tr.appendChild(d);}
}

// ================================================================== socket ==
function connect(){
  ws=new WebSocket(`ws://${location.host}/ws`); ws.binaryType='arraybuffer';
  ws.onopen =()=>{ready(true,'ready');};
  ws.onclose=()=>{ready(false,'link lost — retrying');setState('error','trying to reconnect');setTimeout(connect,1500);};
  ws.onmessage=ev=>{
    if(ev.data instanceof ArrayBuffer) return playWav(ev.data);
    const m=JSON.parse(ev.data);
    switch(m.type){
      case 'hello': $('#sess').textContent='session '+m.session;
        for(const t of (m.earlier||[])){ const d=add('you',t.request,'earlier · '+(t.when||'')); d.style.opacity='.55';
          const r=add('vaj',t.outcome); r.style.opacity='.55'; }
        if((m.earlier||[]).length) add('sys','— picking up from last time —');
        if(!(m.voice&&m.voice.stt&&m.voice.tts)) add('warn','voice is not fully available — you can still type'); break;
      case 'context': renderContext(m); break;
      case 'state':
        if(m.state==='idle'&&(capturing||held)) break;
        setState(m.state, m.state==='thinking'?'working it out':
                          m.state==='awaiting_approval'?'':
                          m.state==='listening'?'go ahead — release when done':
                          m.state==='transcribing'?'':
                          m.state==='speaking'?'':'');
        gateOpen=(m.state==='awaiting_approval'); $('#gate').classList.toggle('open',gateOpen);
        break;
      case 'heard':
        add('you'+(Number(m.conf)<0.5?' low':''), m.text||'(nothing heard)',
            `heard · confidence ${Number(m.conf).toFixed(2)}${m.verdict?' · '+m.verdict:''}`);
        break;
      case 'ask':
        add('ask', m.speak, m.reversible===false?'not reversible':'', m.show||'');
        $('#rsub').textContent=m.speak; break;
      case 'say': add('vaj',m.text); $('#rsub').textContent=m.text; break;
      case 'step':
        add('step'+(m.verified?'':' bad'), m.said||m.tool);
        if(m.injection)add('warn','⚠ that data tried to give me instructions. Ignored — and reported.');
        break;
      case 'done': turns++; add('sys',`done · ${m.elapsed}s`); break;
      case 'busy': add('sys','queued — still finishing the last one'); break;
      case 'error':add('warn',m.text); break;
    }
  };
}

// =================================================================== audio ==
// ⚠ `held` is set synchronously on press; the mic is opened once, up front,
//   never on the critical path of a keystroke. (The first version awaited
//   getUserMedia inside the press handler; mouse-up ran first and every
//   utterance came back "nothing heard".)
let ctx,stream,srcNode,anaMic,anaOut,proc,sink;
let capturing=false, held=false, chunks=[], readyMic=false;
const SR=16000;

async function listDevices(){
  try{
    const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');
    const sel=$('#mics'); sel.innerHTML='';
    devs.forEach((d,i)=>{const o=document.createElement('option');o.value=d.deviceId;
      o.textContent=(d.label||`microphone ${i+1}`).slice(0,40);sel.appendChild(o);});
    const pref=devs.find(d=>/hyperx|headset|headphone/i.test(d.label));
    if(pref){sel.value=pref.deviceId;}
    return sel.value;
  }catch(e){return null;}
}

async function openMic(deviceId){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:SR});
    await ctx.resume();
    stream=await navigator.mediaDevices.getUserMedia({audio:{
      deviceId: deviceId?{exact:deviceId}:undefined, channelCount:1,
      echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
    if(srcNode)srcNode.disconnect();
    srcNode=ctx.createMediaStreamSource(stream);
    anaMic=ctx.createAnalyser(); anaMic.fftSize=1024;
    if(!anaOut){anaOut=ctx.createAnalyser();anaOut.fftSize=2048;anaOut.smoothingTimeConstant=.8;anaOut.connect(ctx.destination);}
    if(!proc){
      proc=ctx.createScriptProcessor(2048,1,1);
      proc.onaudioprocess=e=>{const x=e.inputBuffer.getChannelData(0);
        if(capturing)chunks.push(new Float32Array(x)); else if(handsFree)vad(x);};
      // sink at gain 0: a ScriptProcessor only runs while connected to the
      // destination, and connecting it directly is a feedback path.
      sink=ctx.createGain(); sink.gain.value=0; proc.connect(sink); sink.connect(ctx.destination);
    }
    srcNode.connect(anaMic); anaMic.connect(proc);
    readyMic=true;
    await listDevices();
    return true;
  }catch(e){ readyMic=false; ready(false,'no microphone');
    add('warn','microphone unavailable: '+e.message+' — you can still type'); return false; }
}

function startCapture(){
  if(capturing||!readyMic) return;
  if(state==='speaking'||state==='thinking'||state==='transcribing') return;
  capturing=true; chunks=[];
  $('#talk').classList.add('live');
  setState('listening','go ahead — release when done');
}
function stopCapture(){
  if(!capturing) return;
  capturing=false;
  $('#talk').classList.remove('live');
  let n=0; for(const c of chunks)n+=c.length;
  const out=new Float32Array(n); let o=0; for(const c of chunks){out.set(c,o);o+=c.length;}
  chunks=[];
  if(n<SR*0.25){ setState(gateOpen?'awaiting_approval':'idle','too short — hold a moment longer'); return; }
  let pk=0; for(let i=0;i<out.length;i++) if(Math.abs(out[i])>pk) pk=Math.abs(out[i]);
  if(pk<0.006){ setState(gateOpen?'awaiting_approval':'idle','mic picked up nothing — check the device');
                add('sys','silence on '+($('#mics').selectedOptions[0]?.textContent||'mic')); return; }
  tEnd=performance.now(); ws.send(out.buffer); setState('transcribing','');
}

let noise=.004, quiet=0, talking=false;
function vad(x){
  let s=0; for(let i=0;i<x.length;i++)s+=x[i]*x[i]; const rms=Math.sqrt(s/x.length);
  if(!talking) noise=noise*.98+rms*.02;
  if(rms>Math.max(noise*3.5,.008)){ if(!talking){talking=true;startCapture();} quiet=0; }
  else if(talking){ quiet+=x.length/SR; if(quiet>1.1){talking=false;stopCapture();} }
}

async function playWav(buf){
  if(!ctx){ws.send(JSON.stringify({type:'played'}));return;}
  let a; try{a=await ctx.decodeAudioData(buf.slice(0));}catch(e){ws.send(JSON.stringify({type:'played'}));return;}
  const s=ctx.createBufferSource(); s.buffer=a; s.connect(anaOut);
  s.onended=()=>{ws.send(JSON.stringify({type:'played'}));};
  s.start();
}
</script>
<script>
// ================================================================ controls ==
const talkBtn=$('#talk');
function press(e){ if(e)e.preventDefault(); held=true; if(!handsFree) startCapture(); }
function release(e){ if(e)e.preventDefault(); held=false; if(!handsFree) stopCapture(); }
talkBtn.addEventListener('pointerdown',press);
addEventListener('pointerup',release); addEventListener('pointercancel',release);
let spaceHeld=false;
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'&&!spaceHeld){spaceHeld=true;e.preventDefault();press();}
  else if(e.key==='h'||e.key==='H')toggleFree();
  else if(gateOpen&&/^[yY]$/.test(e.key))ws.send(JSON.stringify({type:'approve'}));
  else if(gateOpen&&(/^[nN]$/.test(e.key)||e.key==='Escape'))ws.send(JSON.stringify({type:'cancel'}));
});
addEventListener('keyup',e=>{if(e.code==='Space'){spaceHeld=false;release();}});
function toggleFree(){
  if(!readyMic){add('sys','microphone not ready');return;}
  handsFree=!handsFree; talkBtn.classList.toggle('free',handsFree);
  $('#talkhint').innerHTML=handsFree?'<b>hands-free</b> · just talk, it sends when you pause · <b>H</b> to stop'
                                   :'<b>hold</b> to talk · <b>SPACE</b> works too · <b>H</b> hands-free';
  add('sys',handsFree?'hands-free on':'hands-free off');
}
$('#f').addEventListener('submit',e=>{e.preventDefault();const v=$('#t').value.trim();if(!v)return;
  $('#t').value='';tEnd=0;ws.send(JSON.stringify({type:'text',text:v}));});
$('#ok').onclick=()=>ws.send(JSON.stringify({type:'approve'}));
$('#no').onclick=()=>ws.send(JSON.stringify({type:'cancel'}));
$('#mics').onchange=e=>openMic(e.target.value);

(async()=>{ connect(); const id=await listDevices(); await openMic(id); })();

// ================================================================= the face ==
// One thing, encoded three ways that agree: colour (state), the ring's
// breathing (alive), the spectrum (the voice itself, from the real analyser).
// No dust, no ticks, no motes: every radius is a function of what is happening.
const cv=$('#c'), g=cv.getContext('2d');
let W,H,DPR,T=0;
function fit(){DPR=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();
  cv.width=r.width*DPR;cv.height=r.height*DPR;g.setTransform(DPR,0,0,DPR,0,0);W=r.width;H=r.height;}
addEventListener('resize',fit); fit();

const BARS=96, bar=new Float32Array(BARS);
const fre=new Uint8Array(1024), tim=new Uint8Array(1024);
const TONE={idle:[92,216,255],listening:[110,231,167],transcribing:[110,231,167],thinking:[92,216,255],
            awaiting_approval:[255,180,84],speaking:[150,235,255],error:[255,95,109]};
let amp=0, col=[92,216,255], spin=0, pulse=0;

function amplitude(){
  if(state==='speaking'&&anaOut){anaOut.getByteFrequencyData(fre);
    let s=0;for(let i=2;i<220;i++)s+=fre[i];return Math.min(1,(s/218)/105);}
  if((capturing||state==='listening')&&anaMic){anaMic.getByteTimeDomainData(tim);
    let s=0;for(let i=0;i<1024;i++){const v=(tim[i]-128)/128;s+=v*v;}return Math.min(1,Math.sqrt(s/1024)*7);}
  return 0;
}
function ring(cx,cy,r,w,a){g.lineWidth=w;g.strokeStyle=a;g.beginPath();g.arc(cx,cy,r,0,6.2832);g.stroke();}

function frame(){
  requestAnimationFrame(frame); T+=1/60;
  const top=H*0.22, bottom=H*0.80, cy=top+(bottom-top)*0.5, cx=W/2;
  const R=Math.max(70,Math.min(W*0.5,(bottom-top))*0.30);
  const a=amplitude(); amp+=(a-amp)*(a>amp?.4:.09);
  const tone=TONE[state]||TONE.idle; for(let i=0;i<3;i++)col[i]+=(tone[i]-col[i])*.07;
  const C=(o=1)=>`rgba(${col[0]|0},${col[1]|0},${col[2]|0},${o})`;
  const thinking=(state==='thinking'||state==='transcribing');
  spin+=thinking?.03:.004; pulse=(Math.sin(T*2.6)+1)/2;
  $('#lvl').style.width=(capturing?amp*100:0)+'%';

  g.clearRect(0,0,W,H);

  // atmosphere
  const hz=g.createRadialGradient(cx,cy,R*.5,cx,cy,R*2.6);
  hz.addColorStop(0,C(.13+amp*.22)); hz.addColorStop(.55,C(.035)); hz.addColorStop(1,C(0));
  g.fillStyle=hz; g.beginPath(); g.arc(cx,cy,R*2.6,0,6.28); g.fill();

  // two quiet outer rings; while thinking, one arc travels them
  ring(cx,cy,R*1.62,1,C(.16)); ring(cx,cy,R*1.9,1,C(.09));
  if(thinking){ g.lineWidth=2; g.strokeStyle=C(.75); g.beginPath(); g.arc(cx,cy,R*1.62,spin,spin+1.1); g.stroke();
                g.strokeStyle=C(.35); g.beginPath(); g.arc(cx,cy,R*1.9,-spin*.7,-spin*.7+.7); g.stroke(); }

  // radial spectrum — the voice itself
  if(state==='speaking'&&anaOut)anaOut.getByteFrequencyData(fre);
  for(let i=0;i<BARS;i++){
    const ang=(i/BARS)*6.2832-Math.PI/2;
    let v=0;
    if(state==='speaking') v=fre[6+Math.floor((i/BARS)*170)]/255;
    else if(capturing||state==='listening') v=amp*(.45+.55*Math.abs(Math.sin(i*.6+T*5)));
    else v=.05+.04*Math.sin(i*.32+T*1.1)+.03*Math.sin(i*.11-T*.7);
    bar[i]+=(v-bar[i])*.32;
    const r0=R*1.06, r1=r0+bar[i]*R*.5;
    g.strokeStyle=C(.2+bar[i]*.8); g.lineWidth=2;
    g.beginPath(); g.moveTo(cx+Math.cos(ang)*r0,cy+Math.sin(ang)*r0);
    g.lineTo(cx+Math.cos(ang)*r1,cy+Math.sin(ang)*r1); g.stroke(); }

  // shell
  const breathe=1+Math.sin(T*1.15)*.018+amp*.07;
  const fill=g.createRadialGradient(cx,cy-R*.15,R*.05,cx,cy,R*breathe);
  fill.addColorStop(0,C(.34+amp*.4)); fill.addColorStop(.62,C(.09)); fill.addColorStop(1,C(.015));
  g.fillStyle=fill; g.beginPath(); g.arc(cx,cy,R*breathe,0,6.28); g.fill();
  ring(cx,cy,R*breathe,1.8,C(.8));

  // approval: an amber ring that will not be missed from across the room
  if(state==='awaiting_approval'){ ring(cx,cy,R*(1.4+pulse*.08),1.4+pulse*2.6,C(.25+pulse*.6)); }

  // iris
  const ir=R*(.2+amp*.2);
  const irg=g.createRadialGradient(cx,cy,0,cx,cy,ir);
  irg.addColorStop(0,'rgba(255,255,255,.92)'); irg.addColorStop(.42,C(.8)); irg.addColorStop(1,C(0));
  g.fillStyle=irg; g.beginPath(); g.arc(cx,cy,ir,0,6.28); g.fill();
}
frame();
</script>
</body></html>
